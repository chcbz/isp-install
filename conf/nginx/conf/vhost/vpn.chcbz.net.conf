server {
    listen 80;
    server_name vpn.chcbz.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vpn.chcbz.net;

    ssl_certificate     /etc/letsencrypt/live/chcbz.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chcbz.net/privkey.pem;

    access_log /home/isp/apps/nginx/logs/vpn.chcbz.net.access.log main;
    error_log  /home/isp/apps/nginx/logs/vpn.chcbz.net.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
