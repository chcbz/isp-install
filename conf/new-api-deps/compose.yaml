name: new-api-deps
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: newapi
      POSTGRES_DB: new-api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - /home/isp/state/new-api-deps/postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U newapi -d new-api']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - sh
      - -ec
      - 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction'
    volumes:
      - /home/isp/state/new-api-deps/redis:/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    logging: *logging
networks:
  backend:
    name: new-api-backend
    driver: bridge
