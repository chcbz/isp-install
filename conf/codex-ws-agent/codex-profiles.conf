[default]
codexBin=/usr/local/bin/codex
codexWorkdir=/home/isp
# Safe default for NEW installations; existing deployed profiles are preserved by the installer.
# danger-full-access is an explicit host-level security decision, not a fix for missing workspace policies.
codexSandbox=workspace-write
codexApproval=never
codexSessionMode=resume
# Milliseconds: 0 disables the timeout; otherwise 1..2147483647.
codexTimeoutMs=900000
# Empty: use CODEX_MODEL fallback or Codex Home's model. Non-empty: CLI --model wins.
codexModel=
# Fast CHAT is opt-in. Disabled defaults never advertise enabled CHAT/INSPECT/EXECUTE profiles.
fastChatEnabled=false
appServerEnabled=false
trueDeltaEnabled=false
# Typed INSPECT remains disabled unless native isolation is freshly measured at startup and an immutable
# carrier evidence file matches the exact profile/provider/model/CA/input-source binding. The accepted
# 1f95 local-image evidence is shipped read-only but is not enabled by this template:
# typedInspectionEnabled=false
# chatModel=gpt-5.6-terra
# typedInspectionCarrierEvidencePath=/home/isp/apps/codex-ws-agent/evidence/typed-inspection-local-image-gpt-5.6-terra-1f95df2.json
# typedInspectionCarrierEvidenceDigest=sha256:d22de19b1b86c988c81deadb2697e5a577fdbc9abb4982ddc015fefa7fd6bdab
# abilities/skills are legacy metadata, not scheduling or skill-activation settings.
# Check the actual business abilities and command readiness with --inspect-config.
# personaName controls display identity, not a model system prompt.
# A07 command.dispatch worktrees are enabled per canonical Agent by selecting a trusted policy.
# workspacePolicyId=cyf
# workspaceRole=coder
# workspaceNoTaskPolicy=reject
# Explicit no-task compatibility is allowed only for listed non-coding command types and a non-Git directory:
# workspaceNoTaskPolicy=dedicated-workdir
# workspaceNonCodingCommandTypes=STATUS_QUERY,DOCUMENT_RENDER
# workspaceFallbackWorkdir=/home/isp/hosts/cyf/non-code/codex-default
# Optional private Workspace File Bridge. Configure only the API origin and a 0700 local root;
# the current AgentRuntime token is received on the authenticated registration ACK and stays in memory.
# Never set workspaceFileRuntimeAuthHeader in this file or the environment.
# workspaceFileApiOrigin=https://api.chaoyoufan.cn
# workspaceFileRootDir=/home/isp/apps/codex-ws-agent/data/private-runs
# Both must be true to create and declare the native GENERATE_IMAGE HTTP-poll executor.
# They do not infer support from installed skills and do not probe a Provider.
# nativeConversationHttpPollEnabled=false
# nativeConversationImageGenerationEnabled=false

[agent.default]
profileId=codex-default
agentId=codex-default
agentName=Codex
personaName=Default
codexHome=/home/isp/apps/codex-ws-agent/.codex-default
isDefault=true

